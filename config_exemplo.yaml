# ============================================================================
# Configuração dos dados de entrada do Risco de Fogo (rf_previsto.py)
# ============================================================================
# Uso:
#   python3 rf_previsto.py --config config_exemplo.yaml
#   python3 rf_previsto.py --config config_exemplo.yaml --horizontes 6m   # a CLI prevalece
#
# Todas as seções são opcionais: o que não for informado usa os padrões da
# produção. Precedência: linha de comando > este arquivo > padrões embutidos.
# ============================================================================

# Diretório base do modelo. Caminhos relativos abaixo são ancorados aqui.
# (Sem --config, o padrão embutido é o mesmo valor abaixo; a variável de
#  ambiente RF_BASE também o sobrepõe. Na produção do Queimadas:
#  /home/queimadas/INPE_FireRiskModel)
base: /p/projetos/grpeta/Team/jorge.gomes/risco-fogo-python

# ----------------------------------------------------------------------------
# Onde estão os dados de entrada
# ----------------------------------------------------------------------------
caminhos:
  # Precipitação observada diária (IMERG)
  imerg_dir: data/output/2.2/Precipitation-2_2
  imerg_subpastas: "{ano}/{mes}"                       # subpastas por data
  imerg_padrao: "INPE_FireRiskModel_2.2_Precipitation_{data}.nc"   # {data}=YYYYMMDD

  # Mapa de vegetação de 1 km ({ano_veg} é resolvido pela regra do modelo:
  # anos >= 2020 usam 2019)
  mapa_vegetacao: data/input/Veg_Map_2020/Merge_MapBiomas_V5_IGBP_C6_{ano_veg}.nc

  # Topografia de 1 km (mesma grade do mapa de vegetação)
  topografia: data/input/topografia/GeoTOPOAmericaSulCentral_V3.nc

  # ERA5 (reanálise, usada pelo rf_observado.py; gerada pelo prepara_era5.py)
  era5_dir: data/output/2.2/ERA5/netcdf
  era5_padrao: "ERA5.OBS.TEMP2m.RH2m.{data}{hora}.nc"    # {data}=YYYYMMDD {hora}=HH
  era5_padrao_vento: "ERA5.OBS.U10m.V10m.{data}{hora}.nc"

  # Pasta de logs (um arquivo por previsão)
  log: log

# ----------------------------------------------------------------------------
# ERA5: horário das variáveis meteorológicas dos produtos OBSERVADOS
# (rf_observado.py e fwi_observado.py) e horas baixadas pelo prepara_era5.py
# ----------------------------------------------------------------------------
# A ERA5 é instantânea (valor da hora cheia). Os índices de perigo pedem as
# condições do momento mais crítico do dia — meio da tarde no RF, meio-dia
# local no FWI —, e NÃO a média diária (a média rebaixa a temperatura, sobe
# a umidade e comprime a variabilidade, subestimando o risco).
#
#   horario: fixo    -> uma única hora UTC para todo o domínio.
#                       É o que a operação faz (18 UTC), mas 18 UTC equivale
#                       a 16 h no litoral do Nordeste e 13 h no Acre.
#   horario: solar   -> HORA SOLAR LOCAL: cada faixa de longitude usa a hora
#                       UTC correspondente (fusos de 15°). O prepara_era5.py
#                       passa a baixar todas as horas necessárias e o campo
#                       é montado faixa a faixa. O produto ganha o sufixo
#                       _SOLAR e os arquivos são rotulados pela hora local.
#
# hora_local: 15 -> meio da tarde (convenção do RF)
# hora_local: 12 -> meio-dia local (convenção do FWI canadense)
era5:
  horario: fixo          # fixo | solar
  hora: 18               # hora UTC usada quando horario: fixo
  hora_local: 15         # hora solar local usada quando horario: solar
  # horas: [17, 18, 19, 20]   # opcional: horas UTC explícitas a baixar/usar

# ----------------------------------------------------------------------------
# Fontes de previsão (mesmas chaves do rf_fontes.py / --config-fontes)
# ----------------------------------------------------------------------------
fontes:
  # BESM T062 — convenção real do pacote besm_queimada (CPTEC):
  # um arquivo por variável com todos os tempos diários da rodada.
  besm:
    subdir: BESM/netcdf/{modelo}
    layout: serie                    # "serie" | "por_tempo"
    padrao_prec: tmp_prec.nc
    padrao_temp: tmp_t2mt.nc
    padrao_ur: tmp_rsmt.nc
    var_prec: prec
    var_temp: t2mt
    var_ur: rsmt
    freq_prec: 1d                    # "1h" | "12h" | "1d"
    tipo_acumulo: intervalo          # "intervalo" | "desde_inicio"
    unidade_temp: K                  # "K" | "C"
    unidade_ur: "%"                  # "%" | "frac"
    horizonte_max_dias: 396          # 13 meses

  # Eta — padrões PROVISÓRIOS: ajuste à convenção real dos arquivos.
  eta:
    subdir: ETA/netcdf/{modelo}
    layout: por_tempo                # um arquivo por horário previsto
    padrao_prec: "ETA.PREV.PREC.{modelo}.{valida}.nc"
    padrao_temp_ur: "ETA.PREV.TEMP2m.RH2m.{modelo}.{valida}.nc"
    var_prec: prec
    var_temp: TEMP2m
    var_ur: RH2m
    freq_prec: 1d
    tipo_acumulo: intervalo
    unidade_temp: K
    unidade_ur: "%"
    horizonte_max_dias: 396

  # O GFS já vem configurado por padrão (não precisa aparecer aqui).
  # Novas fontes podem ser acrescentadas: o nome da chave vale em --fonte.

# ----------------------------------------------------------------------------
# Padrões de execução (todos podem ser sobrepostos na linha de comando)
# ----------------------------------------------------------------------------
execucao:
  # Fonte de previsão. SEM esta chave (e sem --fonte na CLI), a rodada usa a
  # composição original dos produtos operacionais com o GFS (~16 dias) —
  # este é o comportamento padrão. Defina a chave apenas para trocar de
  # fonte (eta, besm, ...). ATENÇÃO: se o YAML definir uma fonte, ela vale
  # sempre que a CLI não passar --fonte; para forçar o GFS sem editar o
  # arquivo, use --fonte padrao (ou legado/nenhuma).
  # fonte: besm          # gfs | eta | besm | (fonte definida acima)

  # Horizontes pré-estabelecidos: lista OU intervalo de/ate/passo.
  # O passo tem a MESMA unidade dos horizontes (Nh, Nd, Nm) e precisa ser
  # compatível com o intervalo (não misture 'ate: 4d18h' com 'passo: 1m').
  de: 6h                 # início do intervalo de horizontes
  ate: 4d18h             # fim do intervalo
  passo: 6h              # passo (Nh, Nd, Nm)
  # horizontes: 18h,7d18h,6m    # alternativa ao intervalo (lista)
  #
  # RODADA SAZONAL DO BESM (13 meses) — duas formas:
  #
  #   (a) UM MAPA POR MÊS, no mesmo dia de cada mês (13 rodadas, rápido):
  #         fonte: besm
  #         de: 1m
  #         ate: 13m
  #         passo: 1m
  #         produto: RF_PREV_BESM
  #
  #   (b) RISCO MÉDIO DE CADA MÊS (recomendado — usa todos os dias):
  #         fonte: besm
  #         de: 1d
  #         ate: 396d        # ~13 meses de previsão diária do BESM
  #         passo: 1d
  #         media_mensal: true   # gera RF.PREV.MEDIA.AAAAMM.nc (13 mapas)
  #         media: true          # e a média de toda a rodada (opcional)
  #         produto: RF_PREV_BESM
  #       São ~396 cálculos diários; use jobs alto e, se quiser só as
  #       médias, rode depois com --so-agrega (não recalcula nada).

  # Data da rodada:
  #   data_final: "20260804"    # rodada fixa (YYYYMMDD)
  #   data_final: hoje          # data do sistema (também: auto, sistema)
  # Omitir a chave equivale a "hoje". Declarar "hoje" + horizontes fixos
  # define uma rodada diária operacional: cada execução usa a data corrente
  # e produz sempre os mesmos horizontes pré-estabelecidos.
  data_final: hoje

  rb_max: 0.9
  # produto: RF_PREV_BESM   # subdiretório de saída em data/output/2.2/
  #                         # (sem a chave: RF_PREV_CUSTOM, ou RF_PREV_<FONTE>)
  jobs: 4
  fallback_gfs: false
  sem_tif: false
  fogograma: false

  # --------------------------------------------------------------------------
  # Análise de sensibilidade (rodadas com/sem topografia e vegetação)
  # --------------------------------------------------------------------------
  # As duas chaves são independentes e combináveis; o produto ganha sufixo
  # automático (_SEMVEG / _SEMTOPO), nunca sobrescrevendo a referência.
  #
  #   sem_topografia: true   -> FTOP = 1; o arquivo de topografia NÃO é lido
  #   sem_vegetacao: true    -> o mapa de vegetação NÃO é lido: classe
  #                             uniforme (classe_veg) em todos os pontos e
  #                             saída na grade da precipitação (sem máscara
  #                             d'água). Com as duas chaves = true, o RF
  #                             roda sem NENHUM arquivo estático.
  #   classe_veg: 4          -> classe usada com sem_vegetacao (padrão 4:
  #                             A = 2.4, PSE_max = 75)
  #
  # Rodada de referência (tudo ligado) — padrão:
  sem_vegetacao: false
  sem_topografia: false
  classe_veg: 4

  # --------------------------------------------------------------------------
  # Escala da umidade relativa no Fator de Umidade (FU = -0,008·UR + 1,3)
  # --------------------------------------------------------------------------
  # ATENÇÃO — achado da conversão: o NCL original converte a UR de % para
  # FRAÇÃO (ur2m/100) antes desta equação. Com UR entre 0 e 1, o FU fica
  # praticamente constante (1,292–1,300) e a umidade quase não modula o RF.
  # Os coeficientes, porém, parecem ter sido pensados para a UR em % (FU =
  # 1,14 a 20 % e 0,58 a 90 %).
  #
  #   correcao_ur: ncl         -> idêntico à operação (padrão)
  #   correcao_ur: decimos     -> UR em décimos (0–10)
  #   correcao_ur: percentual  -> UR em % (0–100)
  #
  # Qualquer valor diferente de 'ncl' acrescenta sufixo ao produto
  # (_URDEC / _URPER) e registra a escolha nos atributos do NetCDF, para
  # nunca se misturar com a rodada de referência. Convém validar com o
  # autor do modelo antes de adotar.
  correcao_ur: ncl

  # --------------------------------------------------------------------------
  # Agregações (RF médio) — também disponíveis na CLI
  # --------------------------------------------------------------------------
  #   media_mensal: true   -> RF.PREV.MEDIA.AAAAMM.nc (um por mês-calendário)
  #   media: true          -> RF.PREV.MEDIA.{ini}-{fim}.nc (rodada inteira)
  #   maximo: true         -> usa o máximo em vez da média (RF.PREV.MAXIMO.*)
  # media_mensal: false
  # media: false
  # maximo: false
  #
  # Exemplos de combinações (descomente UMA por rodada, ou use a CLI, que
  # sempre prevalece: --sem-vegetacao / --sem-topografia / --classe-veg):
  #   sem_topografia: true                        # só sem topografia
  #   sem_vegetacao: true                         # só sem vegetação
  #   sem_vegetacao: true                         # sem as duas — nenhum
  #   sem_topografia: true                        #   arquivo estático
